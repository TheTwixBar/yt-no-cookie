<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>no cookie yt player</title>
  <link rel="icon" type="image/png" href="https://i.imgur.com/8Oz87Gr.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --surface2: #161616;
      --border: #222222;
      --accent: #e8ff47;
      --accent2: #ff4747;
      --text: #f0f0f0;
      --muted: #666;
      --radius: 4px;
    }

    body.light {
      --bg: #f5f5f0;
      --surface: #ffffff;
      --surface2: #eeeeea;
      --border: #ddddd8;
      --accent: #5c00e6;
      --accent2: #e60000;
      --text: #0a0a0a;
      --muted: #888;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; overflow-x: hidden; transition: background 0.25s, color 0.25s; }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
      opacity: 0.4;
    }

    .layout { min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }

    header {
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: rgba(10,10,10,0.92);
      backdrop-filter: blur(12px);
      z-index: 100;
      gap: 12px;
    }
    body.light header { background: rgba(245,245,240,0.92); }

    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-mark { width: 32px; height: 32px; background: var(--accent); border-radius: 2px; display: grid; place-items: center; }
    .logo-mark svg { width: 18px; height: 18px; }
    .logo-text { font-family: 'Space Mono', monospace; font-size: 15px; font-weight: 700; letter-spacing: -0.5px; }
    .logo-text span { color: var(--accent); }

    .header-actions { display: flex; align-items: center; gap: 8px; }
    .icon-btn { background: none; border: 1px solid var(--border); border-radius: var(--radius); color: var(--muted); cursor: pointer; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; transition: border-color 0.15s, color 0.15s; }
    .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
    .icon-btn svg { width: 15px; height: 15px; }

    main { padding: 48px 32px; max-width: 960px; margin: 0 auto; width: 100%; }

    .hero { margin-bottom: 40px; animation: fadeUp 0.5s ease both; }
    .hero h1 { font-family: 'Space Mono', monospace; font-size: clamp(24px, 4vw, 40px); font-weight: 700; line-height: 1.1; letter-spacing: -1px; margin-bottom: 12px; }
    .hero h1 em { font-style: normal; color: var(--accent); }
    .hero p { color: var(--muted); font-size: 14px; font-weight: 300; line-height: 1.6; max-width: 480px; }

    /* TABS */
    .tabs { display: flex; gap: 0; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 28px; animation: fadeUp 0.5s 0.05s ease both; }
    .tab-btn { flex: 1; background: var(--surface); border: none; padding: 10px 6px; font-family: 'Space Mono', monospace; font-size: 10px; color: var(--muted); cursor: pointer; letter-spacing: 0.5px; transition: background 0.15s, color 0.15s; border-right: 1px solid var(--border); }
    .tab-btn:last-child { border-right: none; }
    .tab-btn.active { background: var(--accent); color: #000; font-weight: 700; }
    .tab-btn:not(.active):hover { color: var(--text); background: var(--surface2); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* PLAY BY URL */
    .input-section { margin-bottom: 20px; animation: fadeUp 0.5s 0.1s ease both; }
    .input-label { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 10px; display: block; }
    .input-row { display: flex; gap: 0; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: border-color 0.2s; }
    .input-row:focus-within { border-color: var(--accent); }
    .input-row input { flex: 1; background: var(--surface); border: none; padding: 14px 18px; color: var(--text); font-family: 'Space Mono', monospace; font-size: 13px; outline: none; min-width: 0; }
    .input-row input::placeholder { color: #444; }
    .input-row button { background: var(--accent); color: #000; border: none; padding: 14px 24px; font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 1px; cursor: pointer; transition: opacity 0.15s, transform 0.1s; white-space: nowrap; flex-shrink: 0; }
    .input-row button:hover { opacity: 0.85; }
    .input-row button:active { transform: scale(0.97); }
    .input-hint { margin-top: 8px; font-size: 12px; color: #444; }
    .input-hint code { font-family: 'Space Mono', monospace; color: #555; font-size: 11px; }
    .error-msg { display: none; margin-top: 10px; padding: 10px 14px; background: rgba(255,71,71,0.1); border-left: 3px solid var(--accent2); border-radius: 2px; font-size: 13px; color: var(--accent2); font-family: 'Space Mono', monospace; }
    .error-msg.show { display: block; }

    /* PLAYER OPTIONS */
    .player-options { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; animation: fadeUp 0.5s 0.12s ease both; }
    .opt-toggle { display: flex; align-items: center; gap: 7px; padding: 6px 12px; border: 1px solid var(--border); border-radius: 100px; font-family: 'Space Mono', monospace; font-size: 10px; color: var(--muted); cursor: pointer; background: none; letter-spacing: 0.5px; transition: all 0.15s; }
    .opt-toggle.on { border-color: var(--accent); color: var(--accent); background: rgba(232,255,71,0.06); }
    body.light .opt-toggle.on { background: rgba(92,0,230,0.06); }
    .opt-toggle svg { width: 11px; height: 11px; }

    /* SEARCH */
    .search-section { animation: fadeUp 0.5s 0.1s ease both; }
    .search-row { display: flex; gap: 0; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: border-color 0.2s; margin-bottom: 12px; }
    .search-row:focus-within { border-color: var(--accent); }
    .search-row input { flex: 1; background: var(--surface); border: none; padding: 13px 16px; color: var(--text); font-family: 'Space Mono', monospace; font-size: 13px; outline: none; min-width: 0; }
    .search-row input::placeholder { color: #444; }
    .search-row button { background: var(--accent); color: #000; border: none; padding: 13px 20px; font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 1px; cursor: pointer; white-space: nowrap; flex-shrink: 0; transition: opacity 0.15s; }
    .search-row button:hover { opacity: 0.85; }

    .search-filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
    .filter-label { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: 1px; }
    .filter-btn { font-family: 'Space Mono', monospace; font-size: 10px; padding: 4px 10px; border: 1px solid var(--border); border-radius: 100px; background: none; color: var(--muted); cursor: pointer; letter-spacing: 0.5px; transition: all 0.15s; }
    .filter-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(232,255,71,0.06); }
    body.light .filter-btn.active { background: rgba(92,0,230,0.06); }

    .search-error { display: none; margin-bottom: 12px; padding: 10px 14px; background: rgba(255,71,71,0.1); border-left: 3px solid var(--accent2); border-radius: 2px; font-size: 12px; color: var(--accent2); font-family: 'Space Mono', monospace; line-height: 1.6; }
    .search-error.show { display: block; }
    .search-loading { display: none; padding: 32px; text-align: center; }
    .search-loading.show { display: block; }
    .spinner { width: 24px; height: 24px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 10px; }
    .search-loading p { font-family: 'Space Mono', monospace; font-size: 11px; color: #444; letter-spacing: 1px; }
    .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
    .result-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; cursor: pointer; transition: border-color 0.15s, transform 0.15s; position: relative; }
    .result-item:hover { border-color: var(--accent); transform: translateY(-2px); }
    .result-item.now-playing { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .now-playing-badge { position: absolute; top: 6px; left: 6px; background: var(--accent); color: #000; font-family: 'Space Mono', monospace; font-size: 9px; font-weight: 700; padding: 2px 7px; border-radius: 100px; letter-spacing: 0.5px; z-index: 2; }
    .result-thumb-wrap { position: relative; width: 100%; aspect-ratio: 16/9; overflow: hidden; background: var(--surface2); }
    .result-thumb { width: 100%; height: 100%; object-fit: cover; display: block; }
    .result-play-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0); transition: background 0.15s; }
    .result-item:hover .result-play-overlay { background: rgba(0,0,0,0.4); }
    .result-play-icon { width: 36px; height: 36px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; opacity: 0; transform: scale(0.8); transition: opacity 0.15s, transform 0.15s; }
    .result-item:hover .result-play-icon { opacity: 1; transform: scale(1); }
    .result-play-icon svg { width: 14px; height: 14px; margin-left: 2px; }
    .result-overlay-actions { position: absolute; bottom: 4px; right: 4px; display: flex; gap: 4px; opacity: 0; transition: opacity 0.15s; }
    .result-item:hover .result-overlay-actions { opacity: 1; }
    .result-overlay-btn { background: rgba(0,0,0,0.8); border: none; color: #fff; border-radius: 2px; padding: 3px 7px; font-family: 'Space Mono', monospace; font-size: 9px; cursor: pointer; letter-spacing: 0.3px; transition: background 0.1s, color 0.1s; }
    .result-overlay-btn:hover { background: var(--accent); color: #000; }
    .result-duration { position: absolute; bottom: 4px; left: 4px; background: rgba(0,0,0,0.8); color: #fff; font-family: 'Space Mono', monospace; font-size: 9px; padding: 2px 5px; border-radius: 2px; pointer-events: none; }
    .result-meta { padding: 10px 12px; }
    .result-title { font-size: 12px; color: var(--text); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 4px; }
    .result-channel { font-family: 'Space Mono', monospace; font-size: 10px; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; transition: color 0.1s; }
    .result-channel:hover { color: var(--accent); }

    /* ── Channel Page ── */
    .ch-banner { width: 100%; height: 140px; object-fit: cover; border-radius: var(--radius); background: var(--surface2); display: block; margin-bottom: 0; }
    .ch-banner-placeholder { width: 100%; height: 140px; background: linear-gradient(135deg, var(--surface2) 0%, var(--border) 100%); border-radius: var(--radius); }
    .ch-header { display: flex; align-items: flex-start; gap: 16px; margin: 16px 0 20px; }
    .ch-avatar { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; background: var(--surface2); flex-shrink: 0; border: 2px solid var(--border); }
    .ch-avatar-placeholder { width: 72px; height: 72px; border-radius: 50%; background: var(--surface2); flex-shrink: 0; border: 2px solid var(--border); }
    .ch-info { flex: 1; min-width: 0; }
    .ch-name { font-family: 'Space Mono', monospace; font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .ch-handle { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--muted); margin-bottom: 6px; }
    .ch-stats { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--muted); margin-bottom: 8px; }
    .ch-desc { font-size: 12px; color: var(--muted); line-height: 1.5; max-height: 60px; overflow: hidden; position: relative; transition: max-height 0.3s; }
    .ch-desc.expanded { max-height: 500px; }
    .ch-desc-toggle { font-family: 'Space Mono', monospace; font-size: 9px; color: var(--accent); cursor: pointer; margin-top: 4px; display: inline-block; }
    .ch-sort-row { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .ch-sort-label { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--muted); }
    .ch-sort-btn { font-family: 'Space Mono', monospace; font-size: 9px; padding: 5px 10px; background: var(--surface2); border: 1px solid var(--border); color: var(--muted); cursor: pointer; border-radius: var(--radius); transition: all 0.15s; }
    .ch-sort-btn.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700; }
    .ch-sort-btn:not(.active):hover { color: var(--text); border-color: var(--text); }
    .ch-back { font-family: 'Space Mono', monospace; font-size: 9px; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; margin-bottom: 16px; padding: 5px 10px; border: 1px solid var(--border); border-radius: var(--radius); transition: all 0.15s; background: none; }
    .ch-back:hover { color: var(--text); border-color: var(--text); }
    .result-stats { display: flex; gap: 8px; margin-top: 4px; }
    .result-stat { font-family: 'Space Mono', monospace; font-size: 9px; color: #444; }
    .search-more { margin-top: 16px; text-align: center; }
    .search-more button { background: none; border: 1px solid var(--border); color: var(--muted); font-family: 'Space Mono', monospace; font-size: 11px; padding: 9px 20px; border-radius: var(--radius); cursor: pointer; letter-spacing: 1px; transition: border-color 0.15s, color 0.15s; }
    .search-more button:hover { border-color: var(--accent); color: var(--accent); }
    .empty-msg { font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted); padding: 32px; text-align: center; border: 1px solid var(--border); border-radius: var(--radius); }

    /* PLAYER */
    .player-section { animation: fadeUp 0.5s 0.2s ease both; margin-top: 36px; }
    .player-label-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
    .cookie-pill { display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 100px; border: 1px solid #2a3a00; background: rgba(232,255,71,0.06); font-family: 'Space Mono', monospace; font-size: 10px; color: var(--accent); letter-spacing: 0.5px; }
    body.light .cookie-pill { border-color: #c8b0ff; background: rgba(92,0,230,0.06); }
    .cookie-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 2s ease-in-out infinite; }
    .player-frame { position: relative; width: 100%; padding-top: 56.25%; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .player-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }
    .player-placeholder { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: #333; }
    .player-placeholder svg { width: 48px; height: 48px; opacity: 0.3; }
    .player-placeholder p { font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
    .video-info { margin-top: 14px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    .video-id-display { font-family: 'Space Mono', monospace; font-size: 11px; color: #444; }
    .video-id-display span { color: #666; }
    .info-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .action-btn { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--muted); background: none; border: none; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: color 0.15s; padding: 0; }
    .action-btn:hover { color: var(--accent); }
    .action-btn.active { color: var(--accent); }
    .action-btn svg { width: 11px; height: 11px; }
    .dl-btn { font-family: 'Space Mono', monospace; font-size: 11px; color: #000; background: var(--accent); border: none; cursor: pointer; display: flex; align-items: center; gap: 5px; padding: 5px 12px; border-radius: 2px; font-weight: 700; letter-spacing: 0.5px; transition: opacity 0.15s; }
    .dl-btn:hover { opacity: 0.85; }
    .dl-btn svg { width: 11px; height: 11px; }
    .open-link { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--muted); text-decoration: none; display: flex; align-items: center; gap: 5px; transition: color 0.15s; }
    .open-link:hover { color: var(--accent); }
    .open-link svg { width: 11px; height: 11px; }

    /* HISTORY / FAVORITES */
    .cards-section { margin-top: 36px; animation: fadeUp 0.5s 0.3s ease both; }
    .cards-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
    .cards-actions { display: flex; gap: 10px; align-items: center; }
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; cursor: pointer; transition: border-color 0.15s, transform 0.15s; position: relative; }
    .card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .card-thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: var(--surface2); }
    .card-meta { padding: 8px 10px; }
    .card-title { font-size: 11px; color: var(--text); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
    .card-id { font-family: 'Space Mono', monospace; font-size: 10px; color: #555; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-time { font-size: 10px; color: #444; margin-top: 2px; display: block; }
    .card-remove { position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; background: rgba(0,0,0,0.7); border: none; border-radius: 2px; color: #666; cursor: pointer; display: none; align-items: center; justify-content: center; font-size: 10px; transition: color 0.15s; }
    .card:hover .card-remove { display: flex; }
    .card-remove:hover { color: var(--accent2); }

    /* KEYBOARD HINT */
    .playback-hint { margin-top: 8px; font-family: 'Space Mono', monospace; font-size: 10px; color: #333; letter-spacing: 0.5px; text-align: center; }
    .playback-hint kbd { display: inline-block; background: var(--surface2); border: 1px solid var(--border); border-radius: 2px; padding: 1px 5px; margin: 0 2px; color: #555; font-size: 9px; }
  /* ─── Theme ─── */
  (function initTheme() {
    if (localStorage.getItem(THEME_KEY) === 'light') document.body.classList.add('light');
  })();
  function toggleTheme() {
    document.body.classList.toggle('light');
    localStorage.setItem(THEME_KEY, document.body.classList.contains('light') ? 'light' : 'dark');
  }

  /* ─── Toast ─── */
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  /* ─── Tabs ─── */
  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => {
      const fn = b.getAttribute('onclick') || '';
      const match = fn.match(/switchTab\('(\w+)'\)/);
      if (match) b.classList.toggle('active', match[1] === tab);
    });
    document.querySelectorAll('.tab-panel').forEach(p => {
      p.classList.toggle('active', p.id === 'tab-' + tab);
    });
    if (tab === 'favorites') renderFavoritesTab();
  }

  /* ─── Player options ─── */
  function toggleOpt(opt) {
    playerOpts[opt] = !playerOpts[opt];
    document.getElementById('opt-' + opt)?.classList.toggle('on', playerOpts[opt]); else {
        stopAdvanceWatcher();
        showToast('Auto-next OFF');
      }
      return;
    }
    if (currentVideoId) reloadPlayer();
  }

  /* ─── Search filters ─── */
  function setFilter(type, val, btn) {
    searchFilters[type] = val;
    document.querySelectorAll(`.filter-btn[data-filter="${type}"]`).forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  /* ─── Title cache ─── */
  function getTitles() { try { return JSON.parse(localStorage.getItem(TITLES_KEY)) || {}; } catch { return {}; } }
  function saveTitles(t) { try { localStorage.setItem(TITLES_KEY, JSON.stringify(t)); } catch {} }
  function getCachedTitle(id) { return getTitles()[id] || null; }
  function cacheTitle(id, title) { if (!id || !title) return; const t = getTitles(); t[id] = title; saveTitles(t); }

  async function fetchAndCacheTitle(id) {
    const cached = getCachedTitle(id);
    if (cached) return cached;
    try {
      const res  = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet&id=${id}&key=${API_KEY()}`);
      const data = await res.json();
      const title = data.items?.[0]?.snippet?.title;
      if (title) { cacheTitle(id, title); return title; }
    } catch {}
    return null;
  }

  /* ─── Search ─── */
  async function doSearch(pageToken) {
    const query = document.getElementById('searchInput').value.trim();
    if (!query) return;
    if (!pageToken) {
      lastQuery = query; nextPageToken = null;
      document.getElementById('resultsGrid').innerHTML = '';
      document.getElementById('searchMore').style.display = 'none';
    }
    const errEl  = document.getElementById('searchError');
    const loadEl = document.getElementById('searchLoading');
    errEl.classList.remove('show'); loadEl.classList.add('show');
    try {
      const params = new URLSearchParams({
        part: 'snippet', q: query, type: 'video', maxResults: 12, key: API_KEY(),
        ...(searchFilters.dur && { videoDuration: searchFilters.dur }),
        ...(searchFilters.ord && { order: searchFilters.ord }),
        ...(pageToken && { pageToken })
      });
      const res  = await fetch(`https://www.googleapis.com/youtube/v3/search?${params}`);
      const data = await res.json();
      if (data.error) {
        errEl.textContent = `⚠ API error ${data.error.code || ''}: ${data.error.message}`;
        errEl.classList.add('show'); loadEl.classList.remove('show'); return;
      }
      nextPageToken = data.nextPageToken || null;
      const items = data.items || [];
      // Fetch video stats (duration + views) in one batched call
      const ids = items.map(i => i.id.videoId).filter(Boolean).join(',');
      let statsMap = {};
      if (ids) {
        try {
          const sr = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=contentDetails,statistics&id=${ids}&key=${API_KEY()}`);
          const sd = await sr.json();
          (sd.items || []).forEach(v => { statsMap[v.id] = { duration: parseDuration(v.contentDetails?.duration), views: v.statistics?.viewCount }; });
        } catch {}
      }
      renderResults(items, !!pageToken, statsMap);
      document.getElementById('searchMore').style.display = nextPageToken ? 'block' : 'none';
    } catch (e) {
      errEl.textContent = `⚠ Network error: ${e.message}`; errEl.classList.add('show');
    }
    loadEl.classList.remove('show');
  }

  function loadMore() {
    if (nextPageToken) { document.getElementById('searchInput').value = lastQuery; doSearch(nextPageToken); }
  }

  /* ─── ISO 8601 duration → "mm:ss" / "hh:mm:ss" ─── */
  function parseDuration(iso) {
    if (!iso) return '';
    const m = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
    if (!m) return '';
    const h = parseInt(m[1] || 0), min = parseInt(m[2] || 0), s = parseInt(m[3] || 0);
    if (h) return `${h}:${String(min).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    return `${min}:${String(s).padStart(2,'0')}`;
  }

  /* ─── Format view count ─── */
  function fmtViews(n) {
    if (!n) return '';
    n = parseInt(n);
    if (n >= 1e9) return (n/1e9).toFixed(1) + 'B views';
    if (n >= 1e6) return (n/1e6).toFixed(1) + 'M views';
    if (n >= 1e3) return (n/1e3).toFixed(0) + 'K views';
    return n + ' views';
  }

  function renderResults(items, append, statsMap, gridEl) {
    statsMap = statsMap || {};
    const grid = gridEl || document.getElementById('resultsGrid');
    if (!append) grid.innerHTML = '';
    items.forEach(item => {
      const id        = item.id.videoId;
      const title     = item.snippet.title;
      const channel   = item.snippet.channelTitle;
      const channelId = item.snippet.channelId;
      const thumb     = item.snippet.thumbnails?.medium?.url || '';
      const stats     = statsMap[id] || {};
      const dur       = stats.duration || '';
      const views     = fmtViews(stats.views);
      cacheTitle(id, title);
      const isFav     = getFavs().some(f => f.id === id);
      const isPlaying = id === currentVideoId;

      const el = document.createElement('div');
      el.className = 'result-item' + (isPlaying ? ' now-playing' : '');
      el.dataset.vid = id;
      el.innerHTML = `
        ${isPlaying ? '<div class="now-playing-badge">▶ NOW PLAYING</div>' : ''}
        <div class="result-thumb-wrap">
          <img class="result-thumb" src="${thumb}" alt="" loading="lazy"/>
          <div class="result-play-overlay" data-play="${id}">
            <div class="result-play-icon">
              <svg viewBox="0 0 24 24" fill="#000"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            </div>
          </div>
          ${dur ? `<div class="result-duration">${dur}</div>` : ''}
          <div class="result-overlay-actions">
            <button class="result-overlay-btn fav-tog" data-id="${id}" data-title="${esc(title)}" onclick="event.stopPropagation();toggleFavById('${id}','${esc(title)}',this)">${isFav ? '★' : '☆'}</button>
          </div>
        </div>
        <div class="result-meta">
          <div class="result-title" data-play="${id}">${title}</div>
          <div class="result-channel" data-chid="${channelId}" data-chname="${esc(channel)}">${channel}</div>
          ${(dur || views) ? `<div class="result-stats">${dur ? `<span class="result-stat">${dur}</span>` : ''}${views ? `<span class="result-stat">${views}</span>` : ''}</div>` : ''}
        </div>`;
      el.querySelector('[data-play]')?.addEventListener('click', () => playAndScroll(id));
      el.querySelectorAll('[data-play]').forEach(e => e.addEventListener('click', () => playAndScroll(id)));
      el.querySelector('.result-channel').addEventListener('click', e => {
        e.stopPropagation();
        openChannelPage(channelId);
      });
      grid.appendChild(el);
    });
  }

  function updateSearchNowPlaying(newId) {

  function esc(str) { return (str||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

  /* ─── Channel Page ─── */
  let chState = { channelId: null, uploadsPlaylistId: null, order: 'date', nextPageToken: null };

  async function openChannelPage(channelId) {
    document.getElementById('tab-btn-channel').style.display = '';
    switchTab('channel');

    const loadEl  = document.getElementById('chLoading');
    const errEl   = document.getElementById('chError');
    const content = document.getElementById('chContent');
    errEl.textContent = ''; errEl.classList.remove('show');
    content.style.display = 'none';
    loadEl.style.display = 'block';

    chState.channelId = channelId;
    chState.uploadsPlaylistId = null;
    chState.nextPageToken = null;

    try {
      // Fetch channel metadata + uploads playlist ID in one call
      const metaParams = new URLSearchParams({ part: 'snippet,statistics,brandingSettings,contentDetails', id: channelId, key: API_KEY() });
      const metaRes  = await fetch(`https://www.googleapis.com/youtube/v3/channels?${metaParams}`);
      const metaData = await metaRes.json();
      if (metaData.error) throw new Error(metaData.error.message);
      const ch = metaData.items?.[0];
      if (!ch) throw new Error('Channel not found');

      chState.uploadsPlaylistId = ch.contentDetails?.relatedPlaylists?.uploads || null;

      // Banner
      const bannerUrl = ch.brandingSettings?.image?.bannerExternalUrl;
      document.getElementById('chBannerWrap').innerHTML = bannerUrl
        ? `<img class="ch-banner" src="${bannerUrl}=w1280" alt="channel banner" onerror="this.style.display='none'">`
        : `<div class="ch-banner-placeholder"></div>`;

      // Avatar
      const avatarUrl = ch.snippet?.thumbnails?.high?.url || ch.snippet?.thumbnails?.default?.url;
      document.getElementById('chAvatarWrap').innerHTML = avatarUrl
        ? `<img class="ch-avatar" src="${avatarUrl}" alt="avatar">`
        : `<div class="ch-avatar-placeholder"></div>`;

      document.getElementById('chName').textContent = ch.snippet?.title || '';
      const handle = ch.snippet?.customUrl || '';
      document.getElementById('chHandle').textContent = handle;
      document.getElementById('chHandle').style.display = handle ? '' : 'none';

      const subs  = ch.statistics?.subscriberCount;
      const vids  = ch.statistics?.videoCount;
      const views = ch.statistics?.viewCount;
      const parts = [];
      if (subs && !ch.statistics.hiddenSubscriberCount) parts.push(fmtCount(subs) + ' subscribers');
      if (vids)  parts.push(fmtCount(vids) + ' videos');
      if (views) parts.push(fmtCount(views) + ' total views');
      document.getElementById('chStats').textContent = parts.join(' · ');

      const desc = (ch.snippet?.description || '').trim();
      const descEl   = document.getElementById('chDesc');
      const toggleEl = document.getElementById('chDescToggle');
      descEl.textContent = desc;
      if (desc.length > 180) {
        toggleEl.style.display = 'inline-block';
        toggleEl.textContent = 'SHOW MORE';
        descEl.classList.remove('expanded');
      } else {
        toggleEl.style.display = 'none';
      }

      document.querySelectorAll('.ch-sort-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.ch-sort-btn')[0].classList.add('active');
      chState.order = 'date';

      content.style.display = 'block';
      loadEl.style.display = 'none';
      await loadChVideos(false);
    } catch(e) {
      loadEl.style.display = 'none';
      errEl.textContent = `⚠ ${e.message}`;
      errEl.classList.add('show');
    }
  }

  function fmtCount(n) {
    n = parseInt(n, 10);
    if (n >= 1_000_000) return (n/1_000_000).toFixed(1).replace(/\.0$/,'') + 'M';
    if (n >= 1_000)     return (n/1_000).toFixed(1).replace(/\.0$/,'') + 'K';
    return n.toString();
  }

  async function loadChVideos(append) {
    const errEl   = document.getElementById('chError');
    errEl.textContent = ''; errEl.classList.remove('show');
    const grid    = document.getElementById('chGrid');
    const moreBtn = document.getElementById('chMore');
    if (!append) { grid.innerHTML = ''; moreBtn.style.display = 'none'; }

    try {
      if (chState.order === 'date' && chState.uploadsPlaylistId) {
        // Use uploads playlist — returns ALL videos, not capped like search
        const params = new URLSearchParams({
          part: 'snippet', playlistId: chState.uploadsPlaylistId,
          maxResults: 24, key: API_KEY()
        });
        if (append && chState.nextPageToken) params.set('pageToken', chState.nextPageToken);
        const res  = await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?${params}`);
        const data = await res.json();
        if (data.error) throw new Error(data.error.message);
        chState.nextPageToken = data.nextPageToken || null;

        const items = (data.items || []).filter(i => i.snippet?.resourceId?.kind === 'youtube#video');
        const videoIds = items.map(i => i.snippet.resourceId.videoId);

        let statsMap = {};
        if (videoIds.length) {
          const sr = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet,contentDetails,statistics&id=${videoIds.join(',')}&key=${API_KEY()}`);
          const sd = await sr.json();
          (sd.items || []).forEach(v => {
            statsMap[v.id] = {
              duration:  parseDuration(v.contentDetails?.duration),
              views:     v.statistics?.viewCount,
              title:     v.snippet?.title,
              channel:   v.snippet?.channelTitle,
              channelId: v.snippet?.channelId,
              thumb:     v.snippet?.thumbnails?.medium?.url || ''
            };
          });
        }

        // Build search-result-compatible items for renderResults
        const fakeItems = videoIds.map(id => {
          const s = statsMap[id] || {};
          return {
            id: { videoId: id },
            snippet: {
              title: s.title || id,
              channelTitle: s.channel || '',
              channelId: s.channelId || chState.channelId,
              thumbnails: { medium: { url: s.thumb } }
            }
          };
        }).filter(i => statsMap[i.id.videoId]);

        renderResults(fakeItems, append, statsMap, grid);

      } else {
        // Other sort modes use search API
        const params = new URLSearchParams({
          part: 'snippet', channelId: chState.channelId, type: 'video',
          maxResults: 24, order: chState.order, key: API_KEY()
        });
        if (append && chState.nextPageToken) params.set('pageToken', chState.nextPageToken);
        const res  = await fetch(`https://www.googleapis.com/youtube/v3/search?${params}`);
        const data = await res.json();
        if (data.error) throw new Error(data.error.message);
        chState.nextPageToken = data.nextPageToken || null;

        const ids = (data.items || []).map(i => i.id.videoId).filter(Boolean).join(',');
        let statsMap = {};
        if (ids) {
          const sr = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=contentDetails,statistics&id=${ids}&key=${API_KEY()}`);
          const sd = await sr.json();
          (sd.items || []).forEach(v => { statsMap[v.id] = { duration: parseDuration(v.contentDetails?.duration), views: v.statistics?.viewCount }; });
        }
        renderResults(data.items, append, statsMap, grid);
      }

      moreBtn.style.display = chState.nextPageToken ? 'block' : 'none';
    } catch(e) {
      errEl.textContent = `⚠ ${e.message}`; errEl.classList.add('show');
    }
  }

    /* ─── Video ID + timestamp extraction ─── */
  function extractVideoInfo(raw) {
    raw = (raw || '').trim();
    if (!raw) return null;
    let startTime = null;
    try {
      const url = new URL(raw.startsWith('http') ? raw : 'https://' + raw);
      const t = url.searchParams.get('t');
      if (t) startTime = parseInt(t, 10) || null;
      let vid = null;
      if (url.searchParams.get('v')) vid = url.searchParams.get('v');
      else if (url.hostname === 'youtu.be') vid = url.pathname.slice(1).split('?')[0];
      else { const m = url.pathname.match(/\/(embed|v|shorts)\/([a-zA-Z0-9_-]{11})/); if (m) vid = m[2]; }
      if (vid) return { id: vid, start: startTime };
    } catch {}
    if (/^[a-zA-Z0-9_-]{11}$/.test(raw)) return { id: raw, start: null };
    const m = raw.match(/[?&/]v[=/]([a-zA-Z0-9_-]{11})/);
    if (m) return { id: m[1], start: null };
    return null;
  }
  /* Enable JS API on iframe so YouTube sends postMessage events */
  function buildEmbedUrl(id, start) {
    const p = new URLSearchParams({
      autoplay:    playerOpts.autoplay ? '1' : '0',
      rel:         playerOpts.rel ? '0' : '1',
      loop:        playerOpts.loop ? '1' : '0',
      enablejsapi: '1',            // ← enables postMessage state events
      origin:      window.location.origin,
      ...(playerOpts.loop && { playlist: id }),
      ...(start && { start }),
    });
    return `https://www.youtube-nocookie.com/embed/${id}?${p}`;
  }

  /* ─── Favorites ─── */
  function getFavs() { try { return JSON.parse(localStorage.getItem(FAVS_KEY)) || []; } catch { return []; } }
  function saveFavs(f) { localStorage.setItem(FAVS_KEY, JSON.stringify(f)); }

  function toggleFavById(id, title, btn) {
    let favs = getFavs();
    const idx = favs.findIndex(f => f.id === id);
    if (idx >= 0) {
      favs.splice(idx, 1); showToast('Removed from favorites');
      if (btn) btn.textContent = '☆';
    } else {
      favs.unshift({ id, title: title || getCachedTitle(id) || id, ts: Date.now() });
      showToast('Saved to favorites ★');
      if (btn) btn.textContent = '★';
    }
    saveFavs(favs);
    updateFavBtn();
    renderFavorites(); renderFavoritesTab();
    document.querySelectorAll(`.fav-tog[data-id="${id}"]`).forEach(b => {

    const isFav = getFavs().some(f => f.id === currentVideoId);

    const grid  = document.getElementById('favoritesTabGrid');

    if (!grid) return;
    if (!favs.length) { grid.innerHTML = ''; if (empty) empty.style.display = 'block'; return; }

  /* ─── History ─── */
  function timeAgo(ts) {
    const s = Math.floor((Date.now() - ts) / 1000);
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s/60) + 'm ago';
    if (s < 86400) return Math.floor(s/3600) + 'h ago';
    return Math.floor(s/86400) + 'd ago';
  }

  function getHistory() { try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch { return []; } }

  function saveToHistory(id, title) {
    let h = getHistory().filter(i => i.id !== id);
    h.unshift({ id, title: title || getCachedTitle(id) || null, ts: Date.now() });
    if (h.length > MAX_HISTORY) h = h.slice(0, MAX_HISTORY);
    localStorage.setItem(HISTORY_KEY, JSON.stringify(h));
    renderHistory();
  }

  function removeFromHistory(id) { localStorage.setItem(HISTORY_KEY, JSON.stringify(getHistory().filter(i => i.id !== id))); renderHistory(); }
  function clearHistory() { localStorage.removeItem(HISTORY_KEY); renderHistory(); showToast('History cleared'); }

  function buildCard(item, type) {
    const title     = item.title || getCachedTitle(item.id) || '';
    const removeCmd = type === 'fav'
      ? `toggleFavById('${item.id}','${esc(item.title||'')}',null)`
      : `removeFromHistory('${item.id}')`;
    return `
      <div class="card" onclick="playAndScroll('${item.id}')">
        <img class="card-thumb"
          src="https://i.ytimg.com/vi/${item.id}/maxresdefault.jpg"
          onerror="this.src='https://i.ytimg.com/vi/${item.id}/mqdefault.jpg'"
          alt=""/>
        <div class="card-meta">
          ${title ? `<span class="card-title">${title}</span>` : ''}
          <span class="card-id">${item.id}</span>
          <span class="card-time">${timeAgo(item.ts)}</span>
        </div>
        <button class="card-remove" onclick="event.stopPropagation();${removeCmd}" title="Remove">✕</button>
      </div>`;
  }

  function renderHistory() {
    const h       = getHistory();
    const section = document.getElementById('historySection');
    const grid    = document.getElementById('historyGrid');
    if (!h.length) { section.style.display = 'none'; return; }
    section.style.display = 'block';
    grid.innerHTML = h.map(item => buildCard(item, 'history')).join('');
  }

  /* ─── Export / Import ─── */
  function exportData(type) {
    const data     = type === 'history' ? getHistory() : getFavs();
    const filename = `cookiefree_${type}.json`;
    const blob     = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url      = URL.createObjectURL(blob);
    Object.assign(document.createElement('a'), { href: url, download: filename }).click();
    URL.revokeObjectURL(url);
  }

  function importHistory(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const data = JSON.parse(e.target.result);
        if (!Array.isArray(data)) throw new Error();
        const existing = getHistory();
        const merged   = [...data, ...existing].reduce((acc, item) => {
          if (!acc.find(i => i.id === item.id)) acc.push(item);
          return acc;
        }, []).slice(0, MAX_HISTORY);
        localStorage.setItem(HISTORY_KEY, JSON.stringify(merged));
        renderHistory();
        showToast(`Imported ${data.length} items`);
      } catch { showToast('Import failed — invalid file'); }
    };
    reader.readAsText(file);
    event.target.value = '';
  }

  /* ─── Share links ─── */
  function getUrlParam(k) { return new URLSearchParams(window.location.search).get(k); }
  function updateUrl(id, start) {
    const url = new URL(window.location.href);
    url.searchParams.set('v', id);
    start ? url.searchParams.set('t', start) : url.searchParams.delete('t');
    history.replaceState(null, '', url.toString());
  }

  function copyShareLink() {
    if (!currentVideoId) return;
    const url = new URL(window.location.href);
    url.searchParams.set('v', currentVideoId);
    url.searchParams.delete('t');
    navigator.clipboard.writeText(url.toString()).then(() => showToast('Link copied!')).catch(() => showToast('Copy failed'));
  }

  function copyTimestampLink() {
    if (!currentVideoId) return;
    const elapsed = playerLoadTime ? Math.floor((Date.now() - playerLoadTime) / 1000) : 0;
    const start   = (playerStartTime || 0) + elapsed;
    const url     = new URL(window.location.href);
    url.searchParams.set('v', currentVideoId);
    if (start > 0) url.searchParams.set('t', start);
    navigator.clipboard.writeText(url.toString()).then(() => showToast(`Copied at ${start}s`)).catch(() => showToast('Copy failed'));
  }

  /* ─── Picture-in-Picture ─── */
  function requestPiP() {
    if (!playerIframe) { showToast('No video loaded'); return; }
    try {
      const doc   = playerIframe.contentDocument || playerIframe.contentWindow?.document;
      const video = doc?.querySelector('video');
      if (video?.requestPictureInPicture) { video.requestPictureInPicture().catch(() => showToast('PiP blocked by browser')); }
      else { showToast('PiP unavailable — try browser PiP button'); }
    } catch { showToast('PiP unavailable — cross-origin restriction'); }
  }

  /* ─── Player ─── */
  function reloadPlayer() {
    if (!currentVideoId) return;
    const frame    = document.getElementById('playerFrame');
    const existing = frame.querySelector('iframe');
    if (existing) existing.remove();
    playerIframe = createIframe(currentVideoId, playerStartTime);
    frame.appendChild(playerIframe);
  }

  function createIframe(id, start) {
    const iframe         = document.createElement('iframe');
    iframe.src           = buildEmbedUrl(id, start);
    iframe.allow         = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
    iframe.allowFullscreen = true;
    iframe.title         = 'YouTube video player';
    playerLoadTime       = Date.now();
    return iframe;
  }

  /* ─── Load video ─── */
  async function loadVideo(id) {
    const raw   = typeof id === 'string' ? id : document.getElementById('videoInput').value;
    const error = document.getElementById('errorMsg');
    const frame = document.getElementById('playerFrame');
    const info  = document.getElementById('videoInfo');
    const hint  = document.getElementById('playbackHint');

    const parsed = extractVideoInfo(raw);
    if (!parsed) { error.classList.add('show'); return; }
    error.classList.remove('show');

    const { id: videoId, start } = parsed;
    playerStartTime = start;

    // Cancel any running auto-advance timer for the previous video
    stopAdvanceWatcher();
    _advanceDuration = null;

    const existing = frame.querySelector('iframe');
    if (existing) existing.remove();
    document.getElementById('placeholder').style.display = 'none';

    playerIframe = createIframe(videoId, start);
    frame.appendChild(playerIframe);

    currentVideoId = videoId;
    document.getElementById('currentId').textContent = videoId;
    document.getElementById('nocookieLink').href = `https://www.youtube-nocookie.com/embed/${videoId}`;
    info.style.display = 'flex';
    if (hint) hint.style.display = 'block';
    updateUrl(videoId, start);
    updateFavBtn();
    updateSearchNowPlaying(videoId);

    const knownTitle = getCachedTitle(videoId);
    saveToHistory(videoId, knownTitle);
    if (!knownTitle) {
      fetchAndCacheTitle(videoId).then(title => { if (title) saveToHistory(videoId, title); });
    }

    // Arm auto-advance timer (fetches duration from API, then sets setTimeout)
  }

  /* ─── Keyboard shortcuts ─── */
  document.addEventListener('keydown', e => {
    const tag = document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') {
      if (e.key === 'Enter') {
        if (document.activeElement.id === 'videoInput')  loadVideo();
        if (document.activeElement.id === 'searchInput') doSearch();
      }
      return;
    }
    if (e.key === 'Escape') { closeDownloadDirect(); return; }
    // Player-focused shortcuts — these work without clicking the iframe first
    // by programmatically focusing the iframe before dispatching
    const playerFrame = document.getElementById('playerFrame');
    const map = {
      'f':'toggleFavorite', 'F':'toggleFavorite',
      'c':'copyShareLink',  'C':'copyShareLink',
      'l':'loopToggle',     'L':'loopToggle',
      'a':'autoToggle',     'A':'autoToggle',
      'p':'requestPiP',     'P':'requestPiP',
      't':'toggleTheme',    'T':'toggleTheme',
      'g':'focusUrl',       'G':'focusUrl',
      's':'focusSearch',    'S':'focusSearch',
    };
    const action = map[e.key];
    if (!action) return;
    e.preventDefault();
    switch (action) {
      case 'focusUrl':    document.getElementById('videoInput').focus(); switchTab('play'); break;
      case 'focusSearch': document.getElementById('searchInput').focus(); switchTab('search'); break;
      case 'loopToggle':  toggleOpt('loop'); break;
      case 'autoToggle':  toggleOpt('autoplay'); break;
      default: window[action] && window[action](); break;
    }
  });

  /* ─── Init ─── */
  renderHistory();
  renderFavorites();

  const paramId = getUrlParam('v');
  const paramT  = getUrlParam('t');
  if (paramId) {
    const input = paramT ? `https://www.youtube.com/watch?v=${paramId}&t=${paramT}` : paramId;
    document.getElementById('videoInput').value = input;
    loadVideo(input);
  }

  /* ─── Download modal ─── */
  function openDownload() {
    if (!currentVideoId) return;
    document.getElementById('dlLoading').style.display  = 'block';
    document.getElementById('dlError').style.display    = 'none';
    document.getElementById('dlContent').style.display  = 'none';
    document.getElementById('dlBackdrop').classList.add('show');
    fetchFormats(currentVideoId);
  }
  function closeDownloadDirect() { document.getElementById('dlBackdrop').classList.remove('show'); }

  async function fetchFormats(videoId) {
    try {
      const res  = await fetch(`/.netlify/functions/download?v=${videoId}`);
      const data = await res.json();
      document.getElementById('dlLoading').style.display = 'none';
      if (data.error) {
        const err = document.getElementById('dlError');
        err.textContent = '⚠ ' + data.error; err.style.display = 'block'; return;
      }
      document.getElementById('dlTitle').textContent = data.title || videoId;
      renderFormats(data.formats || []);
      document.getElementById('dlContent').style.display = 'block';
    } catch (e) {
      document.getElementById('dlLoading').style.display = 'none';
      const err = document.getElementById('dlError');
      err.textContent = '⚠ Network error: ' + e.message; err.style.display = 'block';
    }
  }

  function renderFormats(formats) {
    const list = document.getElementById('dlFormatList');
    list.innerHTML = '';
    if (!formats.length) { list.innerHTML = '<div class="dl-error">No downloadable formats found.</div>'; return; }
    const video = formats.filter(f => f.type === 'video');
    const audio = formats.filter(f => f.type === 'audio');
    function makeSection(label, items) {
      if (!items.length) return;
      const lbl = document.createElement('div');
      lbl.className = 'dl-section-label'; lbl.textContent = label;
      list.appendChild(lbl);
      items.forEach(f => {
        const row = document.createElement('div');
        row.className = 'dl-format';
        row.innerHTML = `
          <div class="dl-format-info">
            <span class="dl-format-res">${f.quality}</span>
            <span class="dl-format-meta">video + audio merged</span>
          </div>
          <a class="dl-format-link" href="${f.url}" download target="_blank" rel="noopener">↓ GET</a>`;
        list.appendChild(row);
      });
    }
    makeSection('Video', video);
    makeSection('Audio only', audio);
  }
</script>
</body>
</html>
