[build]
  command   = "pip install yt-dlp && ln -sf $(which yt-dlp) /opt/build/repo/yt-dlp"
  publish   = "."

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[build.environment]
  YTDLP_PATH = "/opt/build/repo/yt-dlp"
  PYTHON_VERSION = "3.11"
