[build]
  command   = "mkdir -p netlify/functions/bin && curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o netlify/functions/bin/yt-dlp && chmod +x netlify/functions/bin/yt-dlp"
  publish   = "."

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
